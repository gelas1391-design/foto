<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk Shopee</title>
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .kartu {
      max-width: 420px;
      margin: 30px auto;
      padding: 15px;
    }
    .foto {
      position: relative;
      display: block;
      border-radius: 12px;
      overflow: hidden;
    }
    .foto img {
      display: block;
      width: 100%;
      min-height: 250px;
      object-fit: cover;
    }
    .play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ee4d2d;
      color: white;
      display: grid;
      place-items: center;
      font-size: 35px;
      box-shadow: 0 3px 12px #5558;
    }
    p { color: #555; }
  </style>
</head>
<body>
  <div class="kartu">
    <a class="foto" href="https://shopee.co.id/" target="_blank" rel="noopener">
      <img src="https://placehold.co/600x750/f3d8c8/333?text=FOTO+PRODUK+LU" alt="Foto produk">
      <span class="play">▶</span>
    </a>
    <p>Klik foto untuk melihat produk di Shopee</p>
  </div>
</body>
</html>
